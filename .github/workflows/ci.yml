name: ci

# Local equivalent (run before pushing; both must be green):
#   make lint && make test && make test-rules && make test-scripts
#   scripts/build-demo-site.sh --check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: build · vet · format · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: gofmt (must be clean)
        run: |
          out="$(gofmt -l cmd internal)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: unit tests
        # Output is captured so a failure can be annotated (readable via the
        # public check-run annotations API) instead of only in the raw log.
        run: |
          set -uo pipefail
          rc=0
          go test ./... -count=1 > /tmp/test.log 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then tail -3 /tmp/test.log; exit 0; fi
          { grep -E '^(--- FAIL|FAIL[[:space:]]|.*\[build failed\]|panic:)' /tmp/test.log \
              || true; } | sed 's/^/::error::/' | head -10
          {
            echo '### go test failures'
            echo '```'
            tail -200 /tmp/test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -60 /tmp/test.log
          exit 1

  rules:
    name: prometheus rule fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install promtool 3.15.0 (pinned)
        run: |
          set -euo pipefail
          v=3.15.0   # pinned: versions.lock.json → prom/prometheus:v3.15.0
          curl -fsSL -o /tmp/prom.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${v}/prometheus-${v}.linux-amd64.tar.gz"
          tar -xzf /tmp/prom.tar.gz -C /tmp
          echo "/tmp/prometheus-${v}.linux-amd64" >> "$GITHUB_PATH"
      - name: check + test rules
        run: |
          promtool check rules monitoring/generated-rules.yaml
          promtool test rules monitoring/rule-tests.yaml

  scripts:
    name: shell self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: selftest (watchdog, context guard, disk floor)
        run: ./scripts/selftest.sh
      - name: shell scripts must be executable in git
        # This checkout lives on a filesystem where core.fileMode is false, so
        # a chmod(2) never reaches the index: the failure mode is a fresh clone
        # (and CI) hitting "Permission denied" on ./scripts/… .
        run: |
          set -euo pipefail
          bad=0
          while read -r mode _ _ path; do
            if head -1 "$path" | grep -q '^#!'; then
              echo "$path mode=$mode"
              if [ "$mode" != "100755" ]; then
                echo "::error file=$path::tracked mode $mode, shebang script must be 100755 (git update-index --chmod=+x $path)"
                bad=1
              fi
            fi
          done < <(git ls-files -s 'scripts/*.sh')
          exit $bad

  site:
    name: demo site data drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: regenerate and compare
        run: |
          set -uo pipefail
          rc=0
          ./scripts/build-demo-site.sh --check > /tmp/check.log 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            tail -2 /tmp/check.log
            exit 0
          fi
          {
            echo '### demo site data drift'
            echo "exit code: $rc"
            echo '```'
            cat /tmp/check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 126 ] || grep -qi 'permission denied' /tmp/check.log; then
            echo "::error::cannot execute scripts/build-demo-site.sh (tracked mode must be 100755)"
          else
            echo "::error::site/*/data differs from a fresh generation (details in the step summary)"
          fi
          cat /tmp/check.log
          exit 1
