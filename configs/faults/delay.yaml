apiVersion: portfolio.sre/v1
kind: FaultExperiment
metadata:
  name: upstream-delay
spec:
  context: kind-sre-lab
  namespace: sre-lab
  target:
    service: reservations
    slot: stable
  workload:
    rate: 50
    seed: 42
    timeoutSeconds: 2
  phases:
    baselineSeconds: 30
    faultSeconds: 60
    recoverySeconds: 60
  fault:
    type: gateway_delay
    delayMilliseconds: 500
    fraction: 0.5
    ttlSeconds: 75
  abort:
    maxFailureRatio: 0.50
    consecutiveWindows: 2
    windowSeconds: 5
  assertions:
    duplicateReservations: false
    negativeInventory: false
    recoveryDeadlineSeconds: 120
