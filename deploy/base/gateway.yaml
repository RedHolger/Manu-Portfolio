apiVersion: v1
kind: Service
metadata:
  name: labgateway
  namespace: sre-lab
spec:
  type: NodePort
  selector:
    app: labgateway
  ports:
    - name: public
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: labgateway
  namespace: sre-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: labgateway
  template:
    metadata:
      labels:
        app: labgateway
    spec:
      containers:
        - name: labgateway
          image: sre-labgateway:local
          args:
            ["-addr=:8080",
             "-stable=http://api-stable.sre-lab.svc:8081",
             "-candidate=http://api-candidate.sre-lab.svc:8081"]
          ports:
            - containerPort: 8080
          env:
            - name: LAB_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lab-admin
                  key: token
          # Admin port stays CLUSTER-INTERNAL (no NodePort, no Ingress).
