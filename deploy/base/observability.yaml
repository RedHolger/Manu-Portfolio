# observability.yaml — Prometheus + Grafana (images/digests pinned at bootstrap).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sre-lab
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.sre-lab.svc:9093']
    rule_files:
      - /etc/prometheus/rules/generated-rules.yaml
      - /etc/prometheus/demo/demo-rules.yaml
    scrape_configs:
      - job_name: labgateway
        static_configs:
          - targets: ['labgateway.sre-lab.svc:8080']
---
# Demo-only alert rule (R4): genuine degradation detector.
# Fires LabBadTemplate when the reservations bad ratio exceeds 5% over 2m.
# Labels are pinned to the RecoverOps policy target; demo-labeled, never
# mixed into BudgetGuard acceptance claims.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-demo-rules
  namespace: sre-lab
data:
  demo-rules.yaml: |
    groups:
      - name: recoverops-demo
        interval: 15s
        rules:
          - alert: LabBadTemplate
            expr: |
              (1 - (sum by (service) (rate(lab_requests_total{result="success",service="reservations"}[2m])) / sum by (service) (rate(lab_requests_total{result!="client_error",service="reservations"}[2m])))) > 0.05
            for: 1m
            labels:
              alertname: LabBadTemplate
              service: reservations
              namespace: sre-lab
              deployment: api-stable
              severity: demo
            annotations:
              summary: "Lab reservations degraded (demo rule for RecoverOps R4)"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: sre-lab
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      nodePort: 30090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sre-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0  # pinned (matches local promtool 3.15.0)
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            # Size bound: experiment TSDB must not grow without limit.
            # 512MB holds weeks of lab traffic; restarts reset it anyway.
            - --storage.tsdb.retention.size=512MB
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: demo-rules
              mountPath: /etc/prometheus/demo
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: demo-rules
          configMap:
            name: prometheus-demo-rules
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: sre-lab
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      nodePort: 30300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: sre-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.6  # pinned
          ports:
            - containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true" # lab only; screenshots without login friction
