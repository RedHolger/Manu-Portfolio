apiVersion: v1
kind: Service
metadata:
  name: api-stable
  namespace: sre-lab
spec:
  selector:
    app: labapi
    slot: stable
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-stable
  namespace: sre-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: labapi
      slot: stable
  template:
    metadata:
      labels:
        app: labapi
        slot: stable
    spec:
      containers:
        - name: labapi
          image: sre-labapi:local # built by scripts/build-images.sh (pins digest)
          args: ["-addr=:8081", "-mode=healthy"]
          ports:
            - containerPort: 8081
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-url
                  key: url
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-candidate
  namespace: sre-lab
spec:
  selector:
    app: labapi
    slot: candidate
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-candidate
  namespace: sre-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: labapi
      slot: candidate
  template:
    metadata:
      labels:
        app: labapi
        slot: candidate
    spec:
      containers:
        - name: labapi
          image: sre-labapi:local
          # LAB_MODE switched healthy|error|slow by the demo orchestrator.
          # -admin-addr enables the localhost-only dependency-fault admin (F3);
          # never expose it via a Service.
          args: ["-addr=:8081", "-mode=healthy", "-admin-addr=127.0.0.1:8084"]
          ports:
            - containerPort: 8081
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-url
                  key: url
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            periodSeconds: 5
