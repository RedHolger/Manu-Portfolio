# Single-replica controller; exclusive local DB/process lock (no HA claim).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recoverops
  namespace: sre-lab
  labels:
    app.kubernetes.io/part-of: sre-portfolio
    app.kubernetes.io/component: recoverops
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: recoverops
  template:
    metadata:
      labels:
        app: recoverops
    spec:
      serviceAccountName: recoverops
      containers:
        - name: controller
          image: sre-recoverops:local
          args: ["serve", "--db", "/data/recoverops.db", "--mode", "enforce-lab",
            "--policy", "/etc/recoverops/policy.yaml"]
          ports:
            - containerPort: 8089
          env:
            - name: RECOVEROPS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: recoverops-token
                  key: token
          volumeMounts:
            - name: data
              mountPath: /data
            - name: policy
              mountPath: /etc/recoverops
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8089
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: recoverops-data
        - name: policy
          configMap:
            name: recoverops-policy
