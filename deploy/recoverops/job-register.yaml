# One-shot known-good registration (explicit setup, run with controller at 0).
# Use scripts/register-recoverops.sh; generateName requires create, not apply.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: ro-register-
  namespace: sre-lab
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: recoverops
      restartPolicy: Never
      containers:
        - name: register
          image: sre-recoverops:local
          args: ["register-live", "--db", "/data/recoverops.db",
            "--policy", "/etc/recoverops/policy.yaml"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: policy
              mountPath: /etc/recoverops
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: recoverops-data
        - name: policy
          configMap:
            name: recoverops-policy
