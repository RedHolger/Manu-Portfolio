apiVersion: portfolio.sre/v1
kind: FaultExperiment
metadata:
  name: runner-pod-live
spec:
  context: kind-sre-lab
  namespace: sre-lab
  target:
    service: reservations
    slot: stable
  workload:
    rate: 5
    seed: 702
    timeoutSeconds: 5
  phases:
    baselineSeconds: 10
    faultSeconds: 25
    recoverySeconds: 15
  fault:
    type: pod_delete
    delayMilliseconds: 0
    fraction: 0
    ttlSeconds: 30
  abort:
    maxFailureRatio: 0.50
    consecutiveWindows: 3
    windowSeconds: 5
  assertions:
    duplicateReservations: 0
    negativeInventory: false
    recoveryDeadlineSeconds: 120
