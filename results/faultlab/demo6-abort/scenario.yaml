apiVersion: portfolio.sre/v1
kind: FaultExperiment
metadata:
  name: abort-fail
spec:
  context: kind-sre-lab
  namespace: sre-lab
  target:
    service: reservations
    slot: stable
  workload:
    rate: 30
    seed: 14
    timeoutSeconds: 2
  phases:
    baselineSeconds: 10
    faultSeconds: 20
    recoverySeconds: 10
  fault:
    type: conn_fail
    delayMilliseconds: 0
    fraction: 1.0
    ttlSeconds: 30
  abort:
    maxFailureRatio: 0.50
    consecutiveWindows: 2
    windowSeconds: 5
  assertions:
    duplicateReservations: 0
    negativeInventory: false
    recoveryDeadlineSeconds: 120
